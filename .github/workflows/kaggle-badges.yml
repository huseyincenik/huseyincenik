name: Kaggle badges

on:
  schedule:
    - cron: "17 4 1 * *"   # 04:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaggle-badges
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Kaggle badge SVGs
        run: |
          set -u
          base="https://road-to-kaggle-grandmaster.vercel.app/api/badges/huseyincenik"
          mkdir -p assets
          for c in competition dataset notebook discussion; do
            if curl -fsSL --retry 4 --retry-delay 6 --max-time 40 "$base/$c/light" -o "assets/kaggle-$c.svg.new"; then
              if head -c 300 "assets/kaggle-$c.svg.new" | grep -qi "<svg"; then
                mv "assets/kaggle-$c.svg.new" "assets/kaggle-$c.svg"
                echo "updated kaggle-$c.svg"
              else
                echo "kaggle-$c: response was not an SVG, keeping previous"
                rm -f "assets/kaggle-$c.svg.new"
              fi
            else
              echo "kaggle-$c: fetch failed, keeping previous"
              rm -f "assets/kaggle-$c.svg.new"
            fi
          done

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kaggle-competition.svg assets/kaggle-dataset.svg assets/kaggle-notebook.svg assets/kaggle-discussion.svg
          if git diff --cached --quiet; then
            echo "Kaggle badges unchanged."
          else
            git commit -m "chore: refresh Kaggle badges"
            git push
          fi
